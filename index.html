<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Policía Municipal de Panamá</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid #C8102E;
      border-radius: 20px;
      padding: 2.5rem 1.8rem;
      box-shadow: 0 15px 40px rgba(200, 16, 46, 0.3);
    }
    .logo-header { margin-bottom: 1.8rem; }
    .logo-img {
      width: 160px;
      height: auto;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 0 15px rgba(200, 16, 46, 0.7));
    }
    .logo-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .logo-header .subtitle {
      font-size: 1.05rem;
      font-weight: 500;
      color: #C8102E;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      margin: 2.2rem 0;
    }
    .btn {
      background: #C8102E;
      color: #FFFFFF;
      text-decoration: none;
      padding: 1.3rem 2rem;
      border-radius: 12px;
      font-size: 1.12rem;
      font-weight: 700;
      transition: all 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      border: 2px solid #FFFFFF;
      box-shadow: 0 5px 18px rgba(200, 16, 46, 0.35);
    }
    .btn:hover {
      background: #FFFFFF;
      color: #C8102E;
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(200, 16, 46, 0.55);
      border-color: #C8102E;
    }
    .btn i { font-size: 1.6rem; }
    .footer {
      margin-top: 2.8rem;
      font-size: 0.88rem;
      color: #BBBBBB;
    }
    @media (max-width: 480px) {
      .container { padding: 2rem 1.5rem; }
      .logo-img { width: 135px; }
      .logo-header h1 { font-size: 1.6rem; }
      .btn { padding: 1.2rem 1.8rem; font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-header">
      <img src="https://drive.google.com/thumbnail?id=1Zj5WzOH2luDxt8OntkYHhYs39gHMWE0A&sz=w600" 
           alt="Logo Policía Municipal de Panamá" class="logo-img" 
           loading="lazy">
      <h1>¡Infórmate ahora!</h1>
      <p class="subtitle">Haz clic en los enlaces</p>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/policiamunicipal_pty/" 
         target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fab fa-instagram"></i> Instagram Oficial
      </a>

      <a href="https://drive.google.com/file/d/1r8cGAjK9DwkDvIBB_mj1AP7E42Lh1YHw/view?usp=sharing" 
         target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fas fa-shirt"></i> Uso correcto del uniforme
      </a>

      <a href="https://drive.google.com/file/d/117mxorurbmMQjWlFPRBHohmvb0Ez2g2B/view?usp=sharing" 
         target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fas fa-file-pdf"></i> Acuerdo N°162 (PDF)
      </a>
    </div>

    <div class="footer">
      ¡La Policía Municipal somos todos! • Alcaldía de Panamá
    </div>
  </div>

</body>
</html>
